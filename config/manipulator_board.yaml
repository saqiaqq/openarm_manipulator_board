manipulator_board_node:
  ros__parameters:
    # ------------------------------------------------------------------
    # 话题命名空间，与上位机 MANIPULATOR_TOPIC_NS 对齐
    # 也可通过环境变量 MANIPULATOR_TOPIC_NS 覆盖（节点启动前 export）
    # ------------------------------------------------------------------
    topic_ns: "/robot_arm"

    # ------------------------------------------------------------------
    # 板卡标识（写入 status.board_id，用于多板卡排障）
    # ------------------------------------------------------------------
    board_id: "arm-controller-01"

    # ------------------------------------------------------------------
    # status 周期发布频率（Hz）
    # ------------------------------------------------------------------
    status_publish_hz: 5.0

    # ------------------------------------------------------------------
    # 命令默认值
    # ------------------------------------------------------------------
    default_arm: "right"                  # 协议未指定 arm 时使用
    default_pose_source: "upper_computer" # pick_place 默认位姿来源

    # ------------------------------------------------------------------
    # 长动作（pick_place）超时（秒）
    # ------------------------------------------------------------------
    command_timeout_s: 60.0

    # ------------------------------------------------------------------
    # request_id 幂等缓存容量（条）
    # ------------------------------------------------------------------
    idempotency_cache_size: 256

    # ------------------------------------------------------------------
    # 安全互锁：control_enabled=false 时是否仍允许运动命令
    # 生产环境建议保持 false（必须先发 start(enable=true)）
    # ------------------------------------------------------------------
    allow_motion_when_disabled: false

    # ------------------------------------------------------------------
    # 默认抓取/放置位姿
    # use_default_poses=true 时，pick_place 命令 params 中若缺少
    # grasp_pose / place_pose，自动使用以下默认值（单位：米/弧度）
    #
    # 坐标系：base_link（机器人底座中心）
    # xyz：[前后 x, 左右 y, 上下 z]，单位：米
    # rpy：[roll, pitch, yaw]，单位：弧度（竖直向下抓取 pitch≈1.5708）
    #
    # 调试建议：先在 RViz 里把机械臂末端拖到目标位置，读出坐标后填入下方
    # ------------------------------------------------------------------
    use_default_poses: true

    # ---- 抓取点（物体所在位置） ----------------------------------------
    default_grasp_xyz: [0.42, -0.10, 0.20]   # 右臂 y 为负；左臂对称取正
    default_grasp_rpy: [0.0,   1.5708, 0.0]  # pitch=90° 表示末端竖直向下

    # ---- 放置点（目标放置位置） ----------------------------------------
    default_place_xyz: [0.30, -0.20, 0.20]   # TODO: 替换为实测坐标
    default_place_rpy: [0.0,   1.5708, 0.0]
